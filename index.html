<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D底なし沼シミュレーション</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f5f5f5;
        }
        #info {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
            color: #333;
            background-color: rgba(255, 255, 255, 0.7);
            z-index: 1;
        }
        h1 {
            margin: 0;
            font-size: 24px;
        }
        #canvas-container {
            flex: 1;
            width: 100%;
            position: relative;
        }
        #controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            z-index: 1;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="range"] {
            width: 150px;
        }
        .value-display {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        #status {
            position: absolute;
            top: 50px;
            left: 10px;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 1;
        }
        #camera-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1;
        }
        #camera-controls button {
            background-color: #2196F3;
            margin: 0 5px;
        }
        #camera-controls button:hover {
            background-color: #0b7dda;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>3D底なし沼シミュレーション</h1>
        <p>物体が底なし沼に沈んでいく様子を3D表示します</p>
    </div>

    <div id="status"></div>

    <div id="camera-controls">
        <button id="camera-top">上から</button>
        <button id="camera-side">横から</button>
        <button id="camera-angle">斜めから</button>
    </div>

    <div id="canvas-container"></div>

    <div id="controls">
        <div class="control-group">
            <label for="densityRatio">物体の密度比</label>
            <input type="range" id="densityRatio" min="0.5" max="3.0" step="0.1" value="2.0">
            <div id="densityValue" class="value-display">2.0</div>
        </div>

        <div class="control-group">
            <label for="waterContent">沼の水分含有量</label>
            <input type="range" id="waterContent" min="10" max="50" step="5" value="30">
            <div id="waterValue" class="value-display">30%</div>
        </div>

        <div class="control-group">
            <label for="particleSize">砂粒子サイズ</label>
            <input type="range" id="particleSize" min="1" max="10" step="1" value="3">
            <div id="particleSizeValue" class="value-display">細かい (3)</div>
        </div>

        <button id="startButton">シミュレーション開始</button>
        <button id="resetButton">リセット</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>

    <script>
        // シミュレーションのパラメータ
        let params = {
            densityRatio: 2.0,
            waterContent: 30,
            particleSize: 3,
            isSimulating: false
        };

        // Three.js変数
        let container, renderer, scene, camera, controls;
        let sphere, quicksand, quicksandSurface;
        let statusElement;

        // 物理パラメータ
        const sphereRadius = 0.5;
        const maxDepth = 3.0;
        const sandSurfaceY = 0;
        let sphereY = 1.5;
        let sinkRate = 0;

        // パーティクルシステム
        let particleSystem;
        let particles = [];
        const particleCount = 3000;

        // シミュレーション時間
        let clock;
        let animationId = null;

        // 初期化
        init();
        animate();

        function init() {
            // コンテナ
            container = document.getElementById('canvas-container');
            statusElement = document.getElementById('status');

            // レンダラー
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // シーン
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xaaddff);
            scene.fog = new THREE.Fog(0xaaddff, 5, 20);

            // カメラ
            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);
            camera.lookAt(0, 0, 0);

            // 照明
            const ambientLight = new THREE.AmbientLight(0x404040, 1);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            dirLight.shadow.camera.near = 1;
            dirLight.shadow.camera.far = 30;
            dirLight.shadow.camera.left = -10;
            dirLight.shadow.camera.right = 10;
            dirLight.shadow.camera.top = 10;
            dirLight.shadow.camera.bottom = -10;
            scene.add(dirLight);

            // 地面
            const groundGeometry = new THREE.PlaneGeometry(20, 20);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x555555,
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -3;
            ground.receiveShadow = true;
            scene.add(ground);

            // 底なし沼のコンテナ（透明な円柱）
            const containerGeometry = new THREE.CylinderGeometry(2, 2, 3, 32, 1, true);
            const containerMaterial = new THREE.MeshStandardMaterial({
                color: 0xaaaaaa,
                transparent: true,
                opacity: 0.2,
                side: THREE.DoubleSide,
                wireframe: true
            });
            const sandContainer = new THREE.Mesh(containerGeometry, containerMaterial);
            sandContainer.position.y = -1.5;
            scene.add(sandContainer);

            // 底なし沼の中身
            createQuicksand();

            // 球体
            createSphere();

            // パーティクルシステム
            createParticles();

            // カメラボタンのイベントリスナー
            document.getElementById('camera-top').addEventListener('click', setCameraTop);
            document.getElementById('camera-side').addEventListener('click', setCameraSide);
            document.getElementById('camera-angle').addEventListener('click', setCameraAngle);

            // スライダーのイベントリスナー
            document.getElementById('densityRatio').addEventListener('input', function() {
                params.densityRatio = parseFloat(this.value);
                document.getElementById('densityValue').textContent = params.densityRatio.toFixed(1);
            });

            document.getElementById('waterContent').addEventListener('input', function() {
                params.waterContent = parseInt(this.value);
                document.getElementById('waterValue').textContent = params.waterContent + '%';
                updateQuicksandAppearance();
            });

            document.getElementById('particleSize').addEventListener('input', function() {
                params.particleSize = parseInt(this.value);
                let sizeText = '';
                if (params.particleSize <= 3) sizeText = '細かい';
                else if (params.particleSize <= 7) sizeText = '中程度';
                else sizeText = '粗い';
                document.getElementById('particleSizeValue').textContent = `${sizeText} (${params.particleSize})`;
                updateParticleSize();
            });

            // ボタンのイベントリスナー
            document.getElementById('startButton').addEventListener('click', startSimulation);
            document.getElementById('resetButton').addEventListener('click', resetSimulation);

            // 時計
            clock = new THREE.Clock();

            // リサイズ対応
            window.addEventListener('resize', onWindowResize);
        }

        function createQuicksand() {
            // 底なし沼の中身（半透明な円柱）
            const quicksandGeometry = new THREE.CylinderGeometry(1.95, 1.95, 2.9, 32);
            const quicksandMaterial = new THREE.MeshStandardMaterial({
                color: 0xD2B48C,
                transparent: true,
                opacity: 0.8,
                roughness: 0.9,
                metalness: 0.1
            });
            quicksand = new THREE.Mesh(quicksandGeometry, quicksandMaterial);
            quicksand.position.y = -1.5;
            scene.add(quicksand);

            // 底なし沼の表面（円）
            const surfaceGeometry = new THREE.CircleGeometry(1.95, 32);
            const surfaceMaterial = new THREE.MeshStandardMaterial({
                color: 0xD2B48C,
                roughness: 0.7,
                metalness: 0.3,
                side: THREE.DoubleSide
            });
            quicksandSurface = new THREE.Mesh(surfaceGeometry, surfaceMaterial);
            quicksandSurface.rotation.x = -Math.PI / 2;
            quicksandSurface.position.y = sandSurfaceY;
            scene.add(quicksandSurface);
        }

        function createSphere() {
            // 球体の作成
            const sphereGeometry = new THREE.SphereGeometry(sphereRadius, 32, 32);
            const sphereMaterial = new THREE.MeshStandardMaterial({
                color: 0xCC0000,
                roughness: 0.2,
                metalness: 0.8
            });
            sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            sphere.position.y = sphereY;
            sphere.castShadow = true;
            scene.add(sphere);
        }

        function createParticles() {
            // パーティクルの作成
            const particleGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            // 位置と色を設定
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;

                // ランダムな位置（円柱の中）
                const radius = 1.9 * Math.sqrt(Math.random());
                const theta = Math.random() * Math.PI * 2;
                const y = Math.random() * 2.9 - 2.9;

                positions[i3] = radius * Math.cos(theta);
                positions[i3 + 1] = y;
                positions[i3 + 2] = radius * Math.sin(theta);

                // 色（砂色の変化）
                const colorVariation = Math.random() * 0.2;
                colors[i3] = 0.8 - colorVariation;
                colors[i3 + 1] = 0.6 - colorVariation;
                colors[i3 + 2] = 0.4 - colorVariation;

                // パーティクルオブジェクト（後で動きを管理）
                particles.push({
                    x: positions[i3],
                    y: positions[i3 + 1],
                    z: positions[i3 + 2],
                    vx: 0,
                    vy: 0,
                    vz: 0,
                    size: Math.random() * params.particleSize * 0.02 + 0.01
                });
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // パーティクルマテリアル
            const particleMaterial = new THREE.PointsMaterial({
                size: 0.05,
                vertexColors: true,
                transparent: true,
                opacity: 0.7
            });

            // パーティクルシステム
            particleSystem = new THREE.Points(particleGeometry, particleMaterial);
            particleSystem.position.y = 0;
            scene.add(particleSystem);
        }

        function updateParticleSize() {
            // パーティクルサイズの更新
            for (let i = 0; i < particles.length; i++) {
                particles[i].size = Math.random() * params.particleSize * 0.02 + 0.01;
            }

            particleSystem.material.size = params.particleSize * 0.02;
        }

        function updateQuicksandAppearance() {
            // 水分含有量に基づく底なし沼の見た目の更新
            const waterRatio = params.waterContent / 100;

            // 透明度を更新
            quicksand.material.opacity = 0.6 + waterRatio * 0.3;

            // 色を更新（水分が多いほど暗くなる）
            const colorValue = 0.8 - waterRatio * 0.3;
            quicksand.material.color.setRGB(colorValue, colorValue * 0.7, colorValue * 0.4);
            quicksandSurface.material.color.copy(quicksand.material.color);
        }

        function startSimulation() {
            if (!params.isSimulating) {
                params.isSimulating = true;
                sphereY = 1.5;
                sphere.position.y = sphereY;
                sinkRate = 0;
            }
        }

        function resetSimulation() {
            params.isSimulating = false;
            sphereY = 1.5;
            sphere.position.y = sphereY;
            sinkRate = 0;

            // パーティクルを初期位置に戻す
            resetParticles();
        }

        function resetParticles() {
            const positions = particleSystem.geometry.attributes.position.array;

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;

                // ランダムな位置に戻す
                const radius = 1.9 * Math.sqrt(Math.random());
                const theta = Math.random() * Math.PI * 2;
                const y = Math.random() * 2.9 - 2.9;

                positions[i3] = radius * Math.cos(theta);
                positions[i3 + 1] = y;
                positions[i3 + 2] = radius * Math.sin(theta);

                particles[i].x = positions[i3];
                particles[i].y = positions[i3 + 1];
                particles[i].z = positions[i3 + 2];
                particles[i].vx = 0;
                particles[i].vy = 0;
                particles[i].vz = 0;
            }

            particleSystem.geometry.attributes.position.needsUpdate = true;
        }

        function setCameraTop() {
            // 上からの視点
            camera.position.set(0, 5, 0.1);
            camera.lookAt(0, 0, 0);
        }

        function setCameraSide() {
            // 横からの視点
            camera.position.set(0, 0, 5);
            camera.lookAt(0, 0, 0);
        }

        function setCameraAngle() {
            // 斜めからの視点
            camera.position.set(3, 3, 3);
            camera.lookAt(0, 0, 0);
        }

        function onWindowResize() {
            // ウィンドウリサイズ時の処理
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function updateParticles() {
            // パーティクルの動きを更新
            if (!params.isSimulating || sphereY >= sandSurfaceY) return;

            const positions = particleSystem.geometry.attributes.position.array;

            // 球体の位置と大きさ
            const spherePos = sphere.position;
            const sphereR = sphereRadius;

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const p = particles[i];

                // 球体からの距離
                const dx = p.x - spherePos.x;
                const dy = p.y - spherePos.y;
                const dz = p.z - spherePos.z;
                const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                // 球体に近いパーティクルは動く
                if (distance < sphereR * 2.5) {
                    // 球体から離れる方向に力を加える
                    const forceFactor = (1 - distance / (sphereR * 2.5)) * 0.01 * sinkRate;
                    p.vx += dx / distance * forceFactor;
                    p.vy += dy / distance * forceFactor;
                    p.vz += dz / distance * forceFactor;
                }

                // 減衰
                p.vx *= 0.95;
                p.vy *= 0.95;
                p.vz *= 0.95;

                // 位置の更新
                p.x += p.vx;
                p.y += p.vy;
                p.z += p.vz;

                // コンテナの境界チェック
                const containerR = 1.9;
                const containerY = -2.9;
                const dist2D = Math.sqrt(p.x * p.x + p.z * p.z);

                if (dist2D > containerR) {
                    // 中心に向かって戻す
                    const angle = Math.atan2(p.z, p.x);
                    p.x = containerR * Math.cos(angle);
                    p.z = containerR * Math.sin(angle);

                    // 速度を反転
                    p.vx *= -0.5;
                    p.vz *= -0.5;
                }

                if (p.y < containerY) {
                    p.y = containerY;
                    p.vy *= -0.5;
                }

                if (p.y > sandSurfaceY) {
                    p.y = sandSurfaceY;
                    p.vy *= -0.5;
                }

                // バッファにポジションを更新
                positions[i3] = p.x;
                positions[i3 + 1] = p.y;
                positions[i3 + 2] = p.z;
            }

            // 更新フラグ
            particleSystem.geometry.attributes.position.needsUpdate = true;
        }

        function updateSphere() {
            // 球体のシミュレーション
            if (!params.isSimulating) return;

            // 沈み込む速度の計算
            const buoyancyFactor = 1 - (params.waterContent / 100);
            const frictionFactor = (10 - params.particleSize) / 10;

            // 深さに応じた抵抗の計算
            const depthRatio = Math.min(1, Math.max(0, (sandSurfaceY - sphereY) / maxDepth));
            const resistanceFactor = Math.pow(depthRatio, 2) * 3;

            // 最終的な沈み込み速度
            const targetSinkRate = (params.densityRatio - 1) * buoyancyFactor * frictionFactor * (1 - resistanceFactor) * 0.02;

            // 速度の更新（徐々に目標値に近づける）
            sinkRate += (targetSinkRate - sinkRate) * 0.1;

            // 位置の更新
            if (sphereY > sandSurfaceY - maxDepth && sphereY <= sandSurfaceY) {
                sphereY -= sinkRate;
            } else if (sphereY > sandSurfaceY) {
                // 自由落下
                sinkRate += 0.001;
                sphereY -= sinkRate;

                // 沼に接触
                if (sphereY <= sandSurfaceY) {
                    sphereY = sandSurfaceY;
                    sinkRate *= 0.2; // 衝撃による減速
                }
            }

            // 球体の位置を更新
            sphere.position.y = sphereY;

            // 波紋効果（沼に沈む時）
            if (sphereY <= sandSurfaceY && sphereY > sandSurfaceY - sphereRadius * 2) {
                // ここで波紋のアニメーションを追加することも可能
            }

            // 状態表示を更新
            updateStatusDisplay();
        }

        function updateStatusDisplay() {
            let status = '';

            if (sphereY <= sandSurfaceY) {
                const sinkDepth = sandSurfaceY - sphereY;
                const sinkPercentage = Math.round((sinkDepth / (2 * sphereRadius)) * 100);

                status += `<div>沈み込み深さ: ${sinkDepth.toFixed(2)}m (球体の${Math.min(100, sinkPercentage)}%)</div>`;
                status += `<div>物体密度比: ${params.densityRatio.toFixed(1)}</div>`;
                status += `<div>水分率: ${params.waterContent}%</div>`;
                status += `<div>粒子サイズ: ${params.particleSize}</div>`;

                // 力の表示
                const buoyancyForce = 1 / params.densityRatio;
                const gravitationalForce = 1.0;
                const frictionForce = (10 - params.particleSize) / 10 * (1 - (sandSurfaceY - sphereY) / maxDepth);

                status += `<div>重力: ${gravitationalForce.toFixed(2)}</div>`;
                status += `<div>浮力: ${buoyancyForce.toFixed(2)}</div>`;
                status += `<div>摩擦力: ${frictionForce.toFixed(2)}</div>`;

                // 理論上の終端深さ
                const terminalDepth = maxDepth * (1 - (1 / params.densityRatio) / ((10 - params.particleSize) / 10));
                status += `<div>理論終端深さ: ${Math.min(maxDepth, Math.max(0, terminalDepth)).toFixed(2)}m</div>`;
            } else {
                status = '球体は沼の上にあります';
            }

            statusElement.innerHTML = status;
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // 球体の更新
            updateSphere();

            // パーティクルの更新
            updateParticles();

            // レンダリング
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
